apiVersion: 1

datasources:
  - name: Instructor PostgreSQL
    uid: instructor-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    editable: true
